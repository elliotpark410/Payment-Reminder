services:
  database:
    image: mysql/mysql-server:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=payment_reminder
      - TZ=America/Los_Angeles
    volumes:
      - my-db:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M
    command:
      - --bind-address=0.0.0.0
      - --performance_schema=OFF
      - --wait_timeout=600
      - --interactive_timeout=600
      - --net_read_timeout=60
      - --net_write_timeout=60
      - --connect_timeout=10

networks:
  app-network:
    driver: bridge

volumes:
  my-db:
